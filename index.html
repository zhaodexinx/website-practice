<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的网站</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5f7ff, #e8f0ff);
      }
      .card {
        width: min(680px, 92vw);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }
      p {
        margin: 0 0 10px;
        color: #444;
        line-height: 1.7;
      }
      .tag {
        display: inline-block;
        margin-top: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #eef3ff;
        color: #2c4bd6;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>网站已成功上线</h1>
      <p>你好，我是 zhaodexinx，这是我的第一个 Cloudflare Pages 网站。</p>
      <p>后续我会持续更新页面内容、样式和功能。</p>
      <span class="tag">Powered by GitHub + Cloudflare Pages</span>
    </main>
  </body>
</html>
