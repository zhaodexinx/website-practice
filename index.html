<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的网站</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5f7ff, #e8f0ff);
      }
      .card {
        width: min(680px, 92vw);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }
      p {
        margin: 0 0 10px;
        color: #444;
        line-height: 1.7;
      }
      .tag {
        display: inline-block;
        margin-top: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #eef3ff;
        color: #2c4bd6;
        font-size: 14px;
      }
      .row {
        margin-top: 18px;
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        border: 1px solid #d8dff5;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        background: #2c4bd6;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      ul {
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
      }
      li {
        background: #f7f9ff;
        border: 1px solid #e8edff;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        color: #333;
      }
      .status {
        min-height: 20px;
        margin-top: 10px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>网站已成功上线</h1>
      <p>你好，我是 zhaodexinx，这是我的第一个 Cloudflare Pages 网站。</p>
      <p>这里已经接入 Supabase 留言板，可以直接写入数据库。</p>
      <span class="tag">Powered by GitHub + Cloudflare Pages</span>

      <form id="msg-form" class="row">
        <input id="msg-input" type="text" placeholder="输入留言内容..." maxlength="120" required />
        <button id="submit-btn" type="submit">提交</button>
      </form>
      <div id="status" class="status"></div>
      <ul id="msg-list"></ul>
    </main>

    <script>
      // TODO: 替换成你自己的 Supabase 项目配置
      const SUPABASE_URL = "https://dtdfyjfshbkkskqveiaf.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_81n2UxIOHDuV4D5d7xYRsA_OCy9DhSt";

      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("msg-list");
      const formEl = document.getElementById("msg-form");
      const inputEl = document.getElementById("msg-input");
      const submitBtnEl = document.getElementById("submit-btn");

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? "#d12c2c" : "#666";
      }

      function renderMessages(messages) {
        if (!messages || messages.length === 0) {
          listEl.innerHTML = "<li>暂无留言，来发布第一条吧。</li>";
          return;
        }
        listEl.innerHTML = messages
          .map((item) => `<li>${item.content}</li>`)
          .join("");
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      async function ensureSupabaseLoaded() {
        if (window.supabase && window.supabase.createClient) return;
        const cdnList = [
          "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
          "https://unpkg.com/@supabase/supabase-js@2"
        ];
        for (const url of cdnList) {
          try {
            await loadScript(url);
            if (window.supabase && window.supabase.createClient) return;
          } catch (_) {
            // 尝试下一个 CDN
          }
        }
        throw new Error("Supabase SDK 加载失败，请检查网络后重试");
      }

      async function loadMessages(supabase) {
        const { data, error } = await supabase
          .from("messages")
          .select("id, content, created_at")
          .order("id", { ascending: false })
          .limit(20);

        if (error) {
          setStatus("读取失败：" + error.message, true);
          return;
        }
        renderMessages(data);
        setStatus("留言已加载");
      }

      async function bootstrap() {
        if (
          SUPABASE_URL.includes("YOUR_PROJECT_ID") ||
          SUPABASE_PUBLISHABLE_KEY.includes("YOUR_SB_PUBLISHABLE_KEY")
        ) {
          setStatus("请先在 index.html 中填入 Supabase URL 和 Publishable Key", true);
          return;
        }

        try {
          await ensureSupabaseLoaded();
        } catch (err) {
          setStatus(err.message, true);
          return;
        }

        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        await loadMessages(supabase);

        formEl.addEventListener("submit", async (event) => {
          event.preventDefault();
          const content = inputEl.value.trim();
          if (!content) return;

          submitBtnEl.disabled = true;
          setStatus("提交中...");

          const { error } = await supabase.from("messages").insert([{ content }]);
          if (error) {
            setStatus("提交失败：" + error.message, true);
            submitBtnEl.disabled = false;
            return;
          }

          inputEl.value = "";
          await loadMessages(supabase);
          setStatus("提交成功");
          submitBtnEl.disabled = false;
        });
      }

      bootstrap();
    </script>
  </body>
</html>
